# Render Blueprint: Bulwark Cloud (landing page, portal, API, job worker) + Postgres.
services:
  - type: web
    name: bulwark-cloud
    runtime: node
    plan: free
    region: oregon
    rootDir: packages/cloud
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: bulwark-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

databases:
  - name: bulwark-db
    plan: free
    region: oregon
    databaseName: bulwark
