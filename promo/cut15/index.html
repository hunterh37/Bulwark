<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bulwark promo 15 s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#0B0D10; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#0B0D10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.0" data-width="1920" data-height="1080">
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html" data-start="0" data-duration="6.0" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="question" data-composition-id="question" data-composition-src="compositions/question.html" data-start="6.0" data-duration="1.75" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="product" data-composition-id="product" data-composition-src="compositions/product.html" data-start="7.75" data-duration="3.75" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="11.5" data-duration="3.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="music" class="clip" src="assets/music-dark-shadows.mp3" data-start="0" data-duration="15.0" data-media-start="13.515" data-volume="0.85" data-fade-in="0.25" data-fade-out="1.5" data-track-index="9"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="0" data-duration="3.85" data-media-start="0.65" data-volume="0.3" data-track-index="11"></audio>
      <audio id="sfx-blackout" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.75" data-volume="0.8" data-track-index="12"></audio>
      <audio id="sfx-year-1942" class="clip" src="assets/sfx/click.mp3" data-start="1.75" data-volume="0.5" data-track-index="13"></audio>
      <audio id="sfx-ui-in" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.65" data-volume="0.6" data-track-index="14"></audio>
      <audio id="sfx-row-0" class="clip" src="assets/sfx/pop.mp3" data-start="8.15" data-volume="0.4" data-track-index="15"></audio>
      <audio id="sfx-row-2" class="clip" src="assets/sfx/pop.mp3" data-start="8.59" data-volume="0.4" data-track-index="16"></audio>
      <audio id="sfx-row-4" class="clip" src="assets/sfx/pop.mp3" data-start="9.03" data-volume="0.4" data-track-index="17"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.45" data-volume="0.7" data-track-index="18"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="12.22" data-volume="0.6" data-track-index="19"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
