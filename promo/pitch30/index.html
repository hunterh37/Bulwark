<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bulwark pitch 30 s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#0B0D10; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#0B0D10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="photos" data-composition-id="photos" data-composition-src="compositions/photos.html" data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="product" data-composition-id="product" data-composition-src="compositions/product.html" data-start="10" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="8" data-duration="2.35" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="offer" data-composition-id="offer" data-composition-src="compositions/offer.html" data-start="22" data-duration="4.4" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="26" data-duration="4" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>

      <!-- Electro Dreams (Mixkit 190), 120 bpm. Track drop at 64.035 s lands on 8.0 s; beats sit on the 0.5 s grid. -->
      <audio id="music" class="clip" src="assets/music-electro-dreams.mp3" data-start="0" data-duration="30" data-media-start="56.035" data-volume="0.77" data-fade-in="0.08" data-fade-out="1.6" data-track-index="9"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="3.6" data-duration="4.5" data-volume="0.24" data-track-index="10"></audio>
      <audio id="sfx-drop" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="8.0" data-volume="0.59" data-track-index="11"></audio>
      <audio id="sfx-lift" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.95" data-volume="0.42" data-track-index="12"></audio>
      <audio id="sfx-scan-click" class="clip" src="assets/sfx/click.mp3" data-start="11.0" data-volume="0.77" data-track-index="13"></audio>
      <audio id="sfx-row-0" class="clip" src="assets/sfx/pop.mp3" data-start="12.5" data-volume="0.34" data-track-index="14"></audio>
      <audio id="sfx-row-2" class="clip" src="assets/sfx/pop.mp3" data-start="13.5" data-volume="0.34" data-track-index="15"></audio>
      <audio id="sfx-row-4" class="clip" src="assets/sfx/pop.mp3" data-start="14.5" data-volume="0.34" data-track-index="16"></audio>
      <audio id="sfx-typing" class="clip" src="assets/sfx/typing.mp3" data-start="18.5" data-volume="0.47" data-track-index="17"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="25.8" data-volume="0.38" data-track-index="18"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="26.4" data-volume="0.47" data-track-index="19"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
