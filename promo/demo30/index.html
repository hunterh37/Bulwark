<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bulwark demo 30 s</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#0B0D10; }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#0B0D10; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.0" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.0" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="code" data-composition-id="code" data-composition-src="compositions/code.html" data-start="5.0" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="product" data-composition-id="product" data-composition-src="compositions/product.html" data-start="8.5" data-duration="11.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="19.5" data-duration="5.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="25.0" data-duration="5.0" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="music" class="clip" src="assets/music-dark-shadows.mp3" data-start="0.03" data-duration="29.97" data-media-start="0.015" data-volume="0.85" data-fade-in="0.05" data-fade-out="1.5" data-track-index="9"></audio>
      <audio id="sfx-cut-1" class="clip" src="assets/sfx/click.mp3" data-start="1.0" data-volume="0.45" data-track-index="10"></audio>
      <audio id="sfx-cut-2" class="clip" src="assets/sfx/click-soft.mp3" data-start="2.0" data-volume="0.45" data-track-index="11"></audio>
      <audio id="sfx-ask" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.5" data-volume="0.75" data-track-index="12"></audio>
      <audio id="sfx-code-0" class="clip" src="assets/sfx/pop.mp3" data-start="5.1" data-volume="0.45" data-track-index="13"></audio>
      <audio id="sfx-code-1" class="clip" src="assets/sfx/pop.mp3" data-start="5.6" data-volume="0.45" data-track-index="14"></audio>
      <audio id="sfx-code-2" class="clip" src="assets/sfx/pop.mp3" data-start="6.1" data-volume="0.45" data-track-index="15"></audio>
      <audio id="sfx-ui-in" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.4" data-volume="0.6" data-track-index="16"></audio>
      <audio id="sfx-scan-click" class="clip" src="assets/sfx/click.mp3" data-start="9.0" data-volume="0.9" data-track-index="17"></audio>
      <audio id="sfx-findings" class="clip" src="assets/sfx/pop.mp3" data-start="10.6" data-volume="0.4" data-track-index="18"></audio>
      <audio id="sfx-fix-click" class="clip" src="assets/sfx/click.mp3" data-start="13.95" data-volume="0.9" data-track-index="19"></audio>
      <audio id="sfx-pr" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="17.05" data-volume="0.55" data-track-index="20"></audio>
      <audio id="sfx-typing" class="clip" src="assets/sfx/typing.mp3" data-start="19.6" data-duration="0.8" data-volume="0.6" data-track-index="21"></audio>
      <audio id="sfx-report" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="21.95" data-volume="0.5" data-track-index="22"></audio>
      <audio id="sfx-flood" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="24.95" data-volume="0.7" data-track-index="23"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="25.72" data-volume="0.6" data-track-index="24"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
