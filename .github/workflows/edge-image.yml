name: edge-image
on:
  push:
    branches: [main]
    paths: ["packages/cloud/src/**", "deploy/edge/**", ".github/workflows/edge-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd packages/cloud && npm ci && npm run build
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/cloud/build/bulwark-edge
          push: true
          tags: ghcr.io/hunterh37/bulwark-runner:1.0.0,ghcr.io/hunterh37/bulwark-runner:latest
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/hunterh37/bulwark-runner@${{ steps.build.outputs.digest }}
      - run: docker run --rm ghcr.io/hunterh37/bulwark-runner:1.0.0 modules
